[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "taskflow-api"
version = "0.1.0"
description = "A production-style multi-user project and task management API."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "email-validator>=2.2,<3",
    "fastapi>=0.118,<1",
    "pydantic-settings>=2.10,<3",
    "PyJWT>=2.10,<3",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy>=2.0.43,<3",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.4,<9",
    "pytest-cov>=6.2,<8",
    "ruff>=0.12,<1",
]
postgres = [
    "psycopg[binary]>=3.2,<4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"docs/generate_project_manual.py" = ["E501"]
